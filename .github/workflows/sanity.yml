name: Sanity

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: sanity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install source package metadata
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest ruff
          python -m pip install -e . --no-deps --no-build-isolation

      - name: Verify canonical package lint
        run: |
          ruff check src/leonardo tests/test_canonical_namespace.py tests/test_plugin_packaging.py

      - name: Verify Python files compile
        run: |
          python -m compileall -q -x '(^|/)(\.git|test_outputs|benchmarks/redocking/1stp|dist)(/|$)' .

      - name: Verify Qt UI file parses
        run: |
          python - << 'PY'
          import xml.etree.ElementTree as ET
          ET.parse('assets/protliginteract.ui')
          print('UI parsed OK')
          PY

      - name: Verify installer scripts
        run: |
          bash -n scripts/install_leonardo.sh
          bash -n scripts/install_envs.sh
          bash -n scripts/install_pymol_loader.sh
          bash -n scripts/build_leonardo_zip.sh
          bash -n scripts/launch_leonardo.sh
          bash -n installers/linux/install_leonardo_linux.sh
          bash -n installers/macos/install_leonardo_macos.sh
          bash -n installers/install_leonardo.sh
          bash -n "installers/Install-Leonardo-macOS.command"
          bash -n scripts/build_installer_bundle.sh
          ./scripts/install_leonardo.sh --check-only --skip-zip --no-pymol-loader
          ./scripts/build_leonardo_zip.sh

      - name: Verify packaged plugin artifact
        run: |
          python -m pytest -q tests/test_plugin_packaging.py

  reviewer-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          activate-environment: protliginteract-full
          environment-file: environments/environment.yml
          auto-activate-base: false

      - name: Install Leonardo in reviewer environment
        run: |
          python -m pip install -e . --no-build-isolation

      - name: Run full reviewer release checks
        run: |
          leonardo-readiness --strict
          make installer-check package
          env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q
