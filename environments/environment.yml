name: protliginteract-full
channels:
  - conda-forge
  - bioconda
  - salilab

dependencies:
  # Core interpreter and package managers
  - python=3.11
  - pip
  - setuptools<82  # ProDy 2.4 still imports pkg_resources, removed in setuptools 82

  # Core plugin/runtime scientific stack
  - numpy>=1.26,<2
  - scipy
  - pandas
  - pyyaml
  - biopython
  - matplotlib
  - scikit-learn
  - rdkit>=2023.09

  # MD / ABFE / force-field workflows
  - openmm>=8.2
  - openmmforcefields
  - openff-toolkit
  - openff-forcefields
  - openff-amber-ff-ports
  - pdbfixer
  - mdanalysis>=2.10,<3
  - pymbar
  - ambertools
  - mdtraj
  - cvxpy
  - ecos

  # Docking / structure prep / pocket tools
  - openbabel
  - smina
  - fpocket
  - meeko

  # QM and visualization stack
  - psi4=1.9.*
  - mopac
  - libint=2.9.*
  - pcmsolver=1.2.3
  - qcelemental>=0.28,<1.0
  - qcengine>=0.30,<1.0
  - ase                 # QM/MM geometry drivers: L-BFGS, dimer TS search, vibrations
  - pymol-open-source
  - pyqtwebengine

  # Homology modeling
  - modeller

  # Bioinformatics sequence analysis (local CLI support for sequence workflows)
  - blast
  - hmmer
  - clustalo
  - mafft

  # Build/runtime helpers used by scripts
  - cmake
  - ninja
  - pkg-config
  - tqdm
  - pytest
  - black
  - ruff
  - pre-commit

  # Python extras used directly by the plugin/workflows
  - pip:
      - dimorphite-dl
      - "prolif==2.2.0"                 # external protein-ligand interaction profiler used by reviewer benchmark
      - "opencv-python==4.11.0.86"       # 4.13 requires NumPy 2 on Python 3.11 and breaks the RDKit ABI
      - "opencv-contrib-python==4.11.0.86"
      - "mediapipe>=0.10.0,<0.10.10"    # 0.10.10+ forces numpy>=2 which breaks pandas/prody
      # AI assistant (natural-language control of Leonardo's tools)
      - "anthropic>=1.8"                 # Claude Messages API
      - "openai>=2.0"                    # OpenAI Responses API
      - "mcp>=1.27"                      # Leonardo tools as an MCP server
      - keyring                          # API keys in the system keychain
      - jsonschema                       # tool-argument validation

# Notes:
# - MODELLER requires a valid license key in your environment.
# - GPU workflows require system CUDA/NVIDIA drivers (e.g., nvidia-smi), which are OS-level installs.
# - For reproducible solves on new machines, use strict channel priority:
#   conda config --set channel_priority strict
# - Optional extras (install after env creation if needed):
#   pip install colabfold alphafold-colabfold catboost xgboost deepchem
# - Legacy AutoDockTools helpers (prepare_receptor4.py / prepare_ligand4.py):
#   install `mgltools` and/or `autodock-vina` from bioconda in a separate step if required.
