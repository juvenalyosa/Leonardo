[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leonardo-pymol-suite"
version = "0.2.0a5"
description = "PyMOL-based structural bioinformatics workflow suite for molecular modeling, docking, simulation, and quantum workflow orchestration."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Juvenal Yosa"}
]
keywords = ["pymol", "structural-bioinformatics", "docking", "openmm", "psi4", "mopac"]

[project.scripts]
leonardo-readiness = "leonardo.report_scientific_readiness:main"

[tool.setuptools]
package-dir = {"leonardo" = "src/leonardo"}
packages = ["leonardo"]
py-modules = [
  "ProtLigInteract",
  "abfe_runtime",
  "alphafold_runtime",
  "background_tasks",
  "bioseq_runtime",
  "calibrate_abfe_group_compact",
  "code_v2",
  "compare_abfe_vs_docking",
  "dock_runtime",
  "genmodels",
  "interaction_runtime",
  "interaction_typing_runtime",
  "leadopt_runtime",
  "ligand_canvas_runtime",
  "ligand_vib_refine_runtime",
  "md_prepare_and_run_3ptb",
  "md_prepare_and_run_3ptb_bound",
  "modeler_runtime",
  "mutator",
  "openmm_dynamics_runtime",
  "openmm_qmmm_runtime",
  "psi4_cluster_runtime",
  "psi4_runtime",
  "qmmm_mopac_runtime",
  "redock_runtime",
  "report_scientific_readiness",
  "run_abfe_benchmark_probe_check",
  "run_ligand_vib_refine",
  "scientific_readiness_runtime",
  "small_molecule_runtime",
  "smina_runtime",
  "structure_fetch_runtime",
  "task_monitor_runtime",
  "train_abfe_steering_policy",
  "trajectory_interaction_runtime",
  "validate_3ptb_ben_parameterization",
  "vs_runtime",
]

[tool.setuptools.data-files]
"share/leonardo" = ["logo.png", "protliginteract.ui", "JSME_minimal.html"]
"share/leonardo/jsme" = ["jsme/*.js", "jsme/*.png", "jsme/*.css", "jsme/*.txt", "jsme/*.gif"]
"share/leonardo/jsme/gwt/chrome" = ["jsme/gwt/chrome/*.css"]
"share/leonardo/jsme/deferredjs/0ADE505A5718D4BE2E0EE1B7C54CC163" = ["jsme/deferredjs/0ADE505A5718D4BE2E0EE1B7C54CC163/*.js"]
"share/leonardo/jsme/deferredjs/4277561D0E87B89F4DFCCC3A712D5B19" = ["jsme/deferredjs/4277561D0E87B89F4DFCCC3A712D5B19/*.js"]

[tool.black]
line-length = 120
target-version = ["py311"]
include = '\\.(py)$'

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # Pyflakes
  "I",  # isort
]
ignore = [
  "E501",  # long scientific labels/tables are kept readable as single lines
  "E731",  # callback lambdas are part of existing injected-runtime APIs
]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
line-ending = "lf"
