[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leonardo-pymol-suite"
version = "0.2.0a23"
description = "PyMOL-based structural bioinformatics workflow suite for molecular modeling, docking, simulation, and quantum workflow orchestration."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Juvenal Yosa"}
]
keywords = ["pymol", "structural-bioinformatics", "docking", "openmm", "psi4", "mopac"]

[project.scripts]
leonardo-readiness = "leonardo.report_scientific_readiness:main"

[tool.setuptools]
package-dir = {"" = "legacy", "leonardo" = "src/leonardo", "leonardo_benchmarks" = "benchmarks"}
packages = [
  "leonardo",
  "leonardo.agent",
  "leonardo.crypsis",
  "leonardo.agent.providers",
  "leonardo.agent.tools",
  "leonardo.agent.ui",
  "leonardo_benchmarks",
  "leonardo_benchmarks.abfe",
  "leonardo_benchmarks.abfe.ptb3_ben",
]
py-modules = [
  "ProtLigInteract",
  "abfe_runtime",
  "alphafold_runtime",
  "background_tasks",
  "bioseq_runtime",
  "calibrate_abfe_group_compact",
  "code_v2",
  "compare_abfe_vs_docking",
  "component_library_runtime",
  "config",
  "dock_runtime",
  "druglike_runtime",
  "genmodels",
  "hardware_runtime",
  "interaction_runtime",
  "interaction_typing_runtime",
  "leadopt_runtime",
  "ligand_canvas_runtime",
  "ligand_sketcher_runtime",
  "ligand_vib_refine_runtime",
  "materials_runtime",
  "mc_ensemble_runtime",
  "membrane_runtime",
  "md_prepare_and_run_3ptb",
  "md_prepare_and_run_3ptb_bound",
  "modeler_runtime",
  "mutator",
  "openmm_dynamics_runtime",
  "openmm_qmmm_runtime",
  "pka_runtime",
  "psi4_cluster_runtime",
  "psi4_runtime",
  "qmmm_mopac_runtime",
  "qmmm_reaction_runtime",
  "redock_runtime",
  "report_scientific_readiness",
  "run_abfe_benchmark_probe_check",
  "run_ligand_vib_refine",
  "scientific_readiness_runtime",
  "small_molecule_runtime",
  "smina_runtime",
  "structure_fetch_runtime",
  "task_monitor_runtime",
  "train_abfe_steering_policy",
  "trajectory_interaction_runtime",
  "ui_layout_runtime",
  "validate_3ptb_ben_parameterization",
  "vs_runtime",
]

[tool.setuptools.data-files]
"share/leonardo" = ["assets/logo.png", "assets/protliginteract.ui"]

[tool.setuptools.package-data]
leonardo = ["abfe_deploy_models.json", "pka_calibration.json", "component_library.json", "rama_reference.npz"]
"leonardo.crypsis" = ["models/*.json", "models/*.npz"]

[tool.black]
line-length = 120
target-version = ["py311"]
include = '\\.(py)$'

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # Pyflakes
  "I",  # isort
]
ignore = [
  "E501",  # long scientific labels/tables are kept readable as single lines
  "E731",  # callback lambdas are part of existing injected-runtime APIs
]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
line-ending = "lf"
